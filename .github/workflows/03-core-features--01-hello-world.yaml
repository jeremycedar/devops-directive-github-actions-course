name: Hello World Series

on:
  pull_request: 
    types: 
      - opened
      - synchronize
      - reopened
    paths: 
      - "!03-core-features/filters/*.md"
      - "03-core-features/filters/*.txt"

jobs:
  job1:
    runs-on: macos-26
    steps:
      - name: Setting Variable
        run: 
          my_var="Hello World! with CLI pull origin my test branch";
          echo $my_var
          
  job2:
    runs-on: macos-26
    steps:
      - run: print("Hello world from python!")
        shell: python
    needs: 
      - job1


    

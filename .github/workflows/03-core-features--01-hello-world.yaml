name: Hello World Series

on:
  push: 
    branches: 
      - "main"

jobs:
  just-say-hello:
    runs-on: macos-26
    steps:
      - name: Setting Variable
        run: 
          my_var="Hello World! with CLI push";
          echo $my_var
          
  say-hello-in-python:
    runs-on: macos-26
    steps:
      - run: print("Hello world from python!")
        shell: python
    needs: 
      - just-say-hello


    

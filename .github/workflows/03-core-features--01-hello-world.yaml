name: Hello World Series

on:
  workflow_dispatch:

jobs:
  just-say-hello:
    runs-on: macos-26
    steps:
      - run: my_var="Hello World!"
      - run: echo $my_var
  say-hello-in-python:
    runs-on: macos-26
    steps:
      - run: print("Hello world from python!")
        shell: python



    

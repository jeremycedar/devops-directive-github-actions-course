name: Hello World Series

on:
  push: 

jobs:
  job1:
    runs-on: ubuntu-latest
    outputs: 
      my_env: ${{ steps.set_my_var.outputs.my_test }}
    steps:
      - name: Setting Variable
        id: set_my_var
        run: 
          my_var="I set the var via interpolation, or whatever it's called.";
          echo "my_test=${my_var}" >> "$GITHUB_OUTPUT";
          echo "${{ steps.set_my_var.outputs.my_env}}";

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - run: echo "${{ needs.job1.outputs.my_env }}"



    
